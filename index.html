<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘의 공기 — 전국 시·도별 미세먼지</title>
<meta name="description" content="전국 17개 시·도의 미세먼지·초미세먼지를 한 화면에서 비교합니다. 지역을 누르면 현재 농도와 등급, 행동 요령을 알려드려요." />
<meta name="theme-color" content="#f9f9f7" />
<meta property="og:title" content="오늘의 공기" />
<meta property="og:description" content="전국 17개 시·도 미세먼지를 한 화면에서 비교" />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
<div class="shell" id="app">

  <header class="site-header">
    <h1 class="site-title">오늘의 공기 <span class="dot">·</span> <span style="font-weight:400;font-size:15px;color:var(--ink-2)">전국 미세먼지</span></h1>
    <div class="header-meta">
      <span class="meta-item">기준 <b id="data-time">—</b></span>
      <span class="meta-item">조회 <b id="fetched-at">—</b></span>
      <span class="stale-badge" id="stale-badge">오래된 데이터</span>
      <button type="button" class="icon-btn" id="refresh-btn">새로고침</button>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="다크 모드 전환">◐</button>
    </div>
  </header>

  <div class="alert" id="alert" role="alert">
    <p id="alert-msg">데이터를 불러오지 못했어요.</p>
    <button type="button" class="icon-btn" id="retry-btn">다시 시도</button>
  </div>

  <!-- 시·도 칩 -->
  <nav class="chips-wrap" aria-label="시·도 선택">
    <div class="chips" id="chips" role="group"></div>
  </nav>

  <!-- 선택 지역 상세 -->
  <section class="card detail" id="detail" aria-live="polite" aria-label="선택 지역 상세">
    <div class="detail-head">
      <h2 class="detail-region" id="detail-region">—</h2>
      <span class="grade-badge" id="detail-grade"><span class="icon"></span><span class="txt">—</span></span>
    </div>
    <p class="detail-sub" id="detail-sub">&nbsp;</p>
    <p class="detail-advice" id="detail-advice">&nbsp;</p>
    <div class="metrics">
      <div class="metric">
        <span class="metric-name">미세먼지 PM10</span>
        <span class="metric-value" id="pm10-value">—</span>
        <span class="metric-unit">㎍/㎥</span>
        <span class="metric-grade" id="pm10-grade">—</span>
      </div>
      <div class="metric">
        <span class="metric-name">초미세먼지 PM2.5</span>
        <span class="metric-value" id="pm25-value">—</span>
        <span class="metric-unit">㎍/㎥</span>
        <span class="metric-grade" id="pm25-grade">—</span>
      </div>
    </div>
  </section>

  <div class="panels">

    <!-- 지도 -->
    <section class="card panel">
      <div class="panel-head">
        <h2 class="panel-title">등급 지도</h2>
        <span class="panel-note" id="map-note">지역을 눌러 보세요</span>
      </div>
      <figure class="map-figure">
        <svg class="map-svg" id="map" role="group" aria-label="전국 시·도별 미세먼지 등급 지도"
             xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
        <figcaption class="sr-only">
          각 시·도를 눌러 상세 수치를 볼 수 있습니다. 같은 정보는 오른쪽 전국 순위 목록에서 표 형태로도 제공됩니다.
        </figcaption>
      </figure>
      <div class="legend" id="legend"></div>
    </section>

    <!-- 랭킹 -->
    <section class="card panel">
      <div class="panel-head">
        <h2 class="panel-title">전국 순위</h2>
        <div class="seg" id="metric-seg" role="group" aria-label="기준 항목">
          <button type="button" data-metric="pm25" aria-pressed="true">PM2.5</button>
          <button type="button" data-metric="pm10" aria-pressed="false">PM10</button>
        </div>
        <div class="seg" id="dir-seg" role="group" aria-label="정렬 방향">
          <button type="button" data-dir="asc" aria-pressed="true">좋은 순</button>
          <button type="button" data-dir="desc" aria-pressed="false">나쁜 순</button>
        </div>
      </div>
      <ol class="rank-list" id="rank-list"></ol>
      <div id="rank-empty"></div>
      <button type="button" class="more-btn" id="more-btn" hidden>전체 보기</button>
    </section>

  </div>

  <footer class="site-footer">
    <p>출처: 한국환경공단 에어코리아 대기오염정보(공공데이터포털) · 시·도 값은 해당 지역 측정소의 유효 측정값 평균입니다.</p>
    <p>지도 경계: 통계청 SGIS 2018 시·도 경계 (공공누리 제1유형)</p>
  </footer>

</div>

<div class="map-tooltip" id="tooltip" role="status" aria-live="off"></div>

<script type="module" src="./assets/app.js"></script>
</body>
</html>
